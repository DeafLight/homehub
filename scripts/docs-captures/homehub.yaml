# Le faux site de recettes (fake-recipes.ts) n'a pas d'adresse publique : autorisé nommément. Les fiches du drive
# (fake-drive.ts) sont servies par le faux monde : autorisées aussi, pour ne jamais interroger le vrai nom.
recipes:
  allowedHosts: [cuisine.exemple.test, www.coursesu.com]
# Fausse télé (fake-tv.ts) : elle reçoit les messages des parents comme l'appli Notifications for Android TV.
tv:
  host: tele.exemple.test
weather:
  label: Angers
  latitude: 47.47
  longitude: -0.55
transit:
  stops:
    - { id: RALL, label: Ralliement }
    - { id: GARE, label: Gare }
# Faux appareils Cast (server/services/cast-fake.ts), démarrés par server.ts : ports et adresse du serveur réécrits
# là-bas selon le port des captures (DOCS_PORT).
cast:
  mediaUrl: http://127.0.0.1:3190
  devices:
    - { id: salon, name: Google Home du salon, host: 127.0.0.1, port: 3195 }
    - { id: tele, name: Télé, host: 127.0.0.1, port: 3196, kind: tv }
