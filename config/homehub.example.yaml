# Configuration de HomeHub.
# Sur le NAS : /mnt/X/docker/data/homehub/homehub.yaml (monté en /data/homehub.yaml dans le conteneur).
# Les modifications sont appliquées automatiquement (en quelques secondes côté serveur, 30 s max sur la tablette).
# Si le fichier est invalide, la configuration précédente est conservée et l'erreur apparaît dans les logs :
#   sudo docker compose logs --tail=20 homehub

# Membres de la famille, dans l'ordre d'affichage.
#   id    : identifiant court (minuscules, chiffres, tirets), utilisé dans l'URL : /p/<id>
#   name  : prénom affiché
#   color : couleur d'accent du profil, au format #rrggbb
#   parent (facultatif, false par défaut) : modifie tous les profils sur la tablette et son téléphone ; un enfant
#     ne modifie que le sien (ni la liste de courses, ni le profil de la famille).
#   calendars (facultatif) : agendas iCal du profil, désignés par le NOM d'une variable d'environnement
#     qui contient l'adresse secrète (Google Agenda : Paramètres de l'agenda → Intégrer l'agenda →
#     « Adresse secrète au format iCal »). Les adresses vont dans app.env, jamais dans ce fichier.
#     Tant qu'aucun profil n'a d'agenda, des événements d'exemple sont affichés.
#   ecoledirecte (facultatif) : prénom de l'élève sur ÉcoleDirecte ; son emploi du temps s'affiche sur ce profil
#     (frise du jour + demain). Identifiants et jetons du compte Famille dans app.env (ECOLEDIRECTE_…),
#     obtenus avec : node scripts/ecoledirecte-pair.ts
#   pronote (facultatif) : prénom de l'enfant sur Pronote (compte parent), même affichage. Le jeton est dans
#     HOMEHUB_STATE_DIR/pronote.json, obtenu avec : node scripts/pronote-pair.ts (voir README)
#   commute (facultatif) : trajet du matin en bus ou tram Irigo, carte « Pars dans N min » sur le dashboard. Plus
#     simple : roue dentée › Transports (adresses, lignes trouvées, selon l'emploi du temps), qui remplace ce réglage :
#     stop (identifiant d'arrêt, voir node scripts/irigo-stops.ts <nom>), line, towards (partie du nom de la
#     destination, si l'arrêt voit passer la ligne dans les deux sens), label (affiché), walkMinutes (marche jusqu'à
#     l'arrêt, 5 par défaut), from/to (heures d'affichage, 07:00–08:30 par défaut), days (lun…dim, lun–ven par défaut)
#   fitness (facultatif, adulte seulement : parent: true) : programme de sport sur son téléphone (onglet Sport).
# Les routines du matin et du soir (étapes, jours, heures) se règlent sur la tablette : roue dentée › Routines.
members:
  - id: alex
    name: Alex
    parent: true
    color: "#5b8def"
    # calendars: [CAL_ALEX]
    # fitness: true
  - id: sam
    name: Sam
    color: "#e8964a"
  - id: lea
    name: Léa
    color: "#3fb8a8"
    # ecoledirecte: Léa
    # pronote: Léa
    # commute: { stop: 1ANRO, line: A, label: Collège, walkMinutes: 6, from: "07:15", to: "08:15" }
  - id: tom
    name: Tom
    color: "#d96aa7"

# Dashboard commun (agenda familial, courses, mots).
family:
  name: Famille
  # calendars: [CAL_FAMILLE]

agenda:
  # Intervalle entre deux téléchargements de chaque agenda (minutes, 1 à 180).
  refreshMinutes: 10

ecoledirecte:
  # Intervalle entre deux connexions à ÉcoleDirecte (minutes, 15 à 1440).
  refreshMinutes: 60

pronote:
  # Intervalle entre deux connexions à Pronote (minutes, 15 à 1440).
  refreshMinutes: 60

# Tablette de la maison : elle peut modifier les listes et appairer les téléphones. Elle est reconnue de préférence à
# sa clé (variable HOMEHUB_KIOSK_KEY, donnée une fois dans son adresse de démarrage : https://…/#key=<clé>), ou à ses
# adresses IP ci-dessous (fixées dans la box). Les autres appareils du réseau lisent seulement ; les téléphones
# appairés écrivent au nom de leur profil. Une connexion locale directe (127.0.0.1 : développement, vérification de
# santé du conteneur) compte aussi comme la tablette ; un en-tête qui prétend venir de 127.0.0.1, jamais.
kiosk:
  addresses: []

# Proxys de confiance (adresses ou plages CIDR, IPv4 ou IPv6). Seuls ceux-là peuvent donner l'adresse du client dans
# X-Real-IP ou X-Forwarded-For ; pour toute autre connexion, ces en-têtes sont ignorés (n'importe qui peut les
# écrire). Par défaut aucun : l'adresse retenue est celle de la connexion. À remplir seulement si kiosk.addresses doit
# reconnaître la tablette derrière le proxy : l'adresse (ou le réseau Docker) de Nginx Proxy Manager, par exemple
# [172.20.0.0/16]. La clé de la tablette et les jetons des téléphones n'en ont pas besoin.
trustedProxies: []

# Reconnaissance faciale de la tablette (qui modifie). Valeurs par défaut ci-dessous ; pour les ajuster : roue dentée ›
# Visages › Diagnostic, sur la tablette (et les logs, « visages : … »).
#   threshold      : ressemblance minimale avec un visage enregistré (0 à 1)
#   margin         : avance minimale sur la personne suivante (deux frères et sœurs proches : l'augmenter)
#   antispoof      : score minimal « vrai visage » plutôt qu'une photo
#   liveness       : score minimal « visage vivant » plutôt qu'un écran
#   sessionMinutes : durée d'une identification sans geste
#   minConfidence  : confiance minimale du détecteur pour voir un visage (plus bas : de plus loin, plus d'erreurs)
#   minSize        : largeur minimale du visage, en part de l'image, pour tenter de le reconnaître (0 : aucune) ;
#                    plus petit, il réveille seulement la tablette
#   learnMinutes   : au plus une empreinte apprise par personne et par période, lors d'une reconnaissance sûre
#                    (0 : jamais)
# faces:
#   threshold: 0.55
#   margin: 0.05
#   antispoof: 0.2
#   liveness: 0.2
#   sessionMinutes: 10
#   minConfidence: 0.5
#   minSize: 0
#   learnMinutes: 30

ui:
  # Retour automatique à l'écran d'accueil après ce délai sans contact (secondes).
  idleTimeoutSeconds: 180
  # Veille de la tablette après ce délai sans contact ni visage devant la caméra (minutes ; 0 : jamais) : écran noir,
  # horloge qui se déplace. Un contact ou un visage la réveille.
  screensaverMinutes: 5

# Bus et tram Irigo (Angers), temps réel en open data, sans clé : prochains passages sur l'accueil et la veille.
# Sans arrêt, rien n'est affiché. Les arrêts se règlent aussi sur la tablette (roue dentée › Transports), qui remplace
# alors `stops` ; refreshSeconds reste ici.
#   stops          : 4 au plus ; id (node scripts/irigo-stops.ts <nom> ; un identifiant par sens), label (sinon le
#                    nom Irigo), lines (sinon toutes les lignes de l'arrêt)
#   refreshSeconds : intervalle entre deux appels à Irigo (30 à 600, 60 par défaut)
# transit:
#   stops:
#     - { id: 1ANRO, label: Roseraie, lines: [A] }

# Vacances scolaires (calendrier officiel, data.education.gouv.fr, sans clé). Sans cette section, rien n'est affiché.
# Valeur par défaut seulement : dès que la page « Vacances scolaires » (roue dentée de la tablette) est enregistrée,
# son choix (state/holiday-settings.json) prend le pas sur cette section.
#   academie : l'académie (« Nantes », « Orléans-Tours », « Normandie »… ; Corse et outre-mer : « Corse », « Réunion »…)
#   zone     : ou bien la zone, A, B ou C (pas les deux)
# Puce « Vacances de Noël dans 12 jours » 3 semaines avant ; pendant les vacances, ni trajet du matin, ni cours, et
# les routines laissent de côté les étapes des jours d'école (prévues du lundi au vendredi seulement, par exemple).
holidays:
  academie: Nantes

# Recettes (facultatif) : le carnet lit la page d'une recette partagée, seulement sur un site à l'adresse publique.
#   allowedHosts : noms de sites autorisés malgré une adresse locale ou privée (un serveur de recettes de la maison) ;
#                  aucun par défaut
# recipes:
#   allowedHosts: [recettes.maison.lan]

# Météo (Open-Meteo, modèles Météo-France). Sans cette section, le bloc météo est masqué.
#   label          : nom du lieu affiché
#   latitude/longitude : coordonnées en degrés décimaux ; deux décimales (~1 km) suffisent
#   refreshMinutes : intervalle entre deux appels à l'API (5 à 180, 15 par défaut)
weather:
  label: Paris
  latitude: 48.85
  longitude: 2.35
