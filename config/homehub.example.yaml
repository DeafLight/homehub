# Configuration de HomeHub.
# Sur le NAS : /mnt/X/docker/data/homehub/homehub.yaml (monté en /data/homehub.yaml dans le conteneur).
# Les modifications sont appliquées automatiquement (en quelques secondes côté serveur, 30 s max sur la tablette).
# Si le fichier est invalide, la configuration précédente est conservée et l'erreur apparaît dans les logs :
#   sudo docker compose logs --tail=20 homehub

# Membres de la famille, dans l'ordre d'affichage.
#   id    : identifiant court (minuscules, chiffres, tirets), utilisé dans l'URL : /p/<id>
#   name  : prénom affiché
#   color : couleur d'accent du profil, au format #rrggbb
#   calendars (facultatif) : agendas iCal du profil, désignés par le NOM d'une variable d'environnement
#     qui contient l'adresse secrète (Google Agenda : Paramètres de l'agenda → Intégrer l'agenda →
#     « Adresse secrète au format iCal »). Les adresses vont dans app.env, jamais dans ce fichier.
#     Tant qu'aucun profil n'a d'agenda, des événements d'exemple sont affichés.
#   ecoledirecte (facultatif) : prénom de l'élève sur ÉcoleDirecte ; son emploi du temps s'affiche sur ce profil
#     (frise du jour + demain). Identifiants et jetons du compte Famille dans app.env (ECOLEDIRECTE_…),
#     obtenus avec : node scripts/ecoledirecte-pair.ts
#   pronote (facultatif) : prénom de l'enfant sur Pronote (compte parent), même affichage. Le jeton est dans
#     HOMEHUB_STATE_DIR/pronote.json, obtenu avec : node scripts/pronote-pair.ts (voir README)
members:
  - id: alex
    name: Alex
    color: "#5b8def"
    # calendars: [CAL_ALEX]
  - id: sam
    name: Sam
    color: "#e8964a"
  - id: lea
    name: Léa
    color: "#3fb8a8"
    # ecoledirecte: Léa
    # pronote: Léa
  - id: tom
    name: Tom
    color: "#d96aa7"

# Dashboard commun (agenda familial, courses, mots).
family:
  name: Famille
  # calendars: [CAL_FAMILLE]

agenda:
  # Intervalle entre deux téléchargements de chaque agenda (minutes, 1 à 180).
  refreshMinutes: 10

ecoledirecte:
  # Intervalle entre deux connexions à ÉcoleDirecte (minutes, 15 à 1440).
  refreshMinutes: 60

pronote:
  # Intervalle entre deux connexions à Pronote (minutes, 15 à 1440).
  refreshMinutes: 60

# Tablette de la maison : elle peut modifier les listes et appairer les téléphones. Elle est reconnue de préférence à
# sa clé (variable HOMEHUB_KIOSK_KEY, donnée une fois dans son adresse de démarrage : https://…/#key=<clé>), ou à ses
# adresses IP ci-dessous (fixées dans la box). Les autres appareils du réseau lisent seulement ; les téléphones
# appairés écrivent au nom de leur profil. En développement, l'accès local (127.0.0.1) est toujours accepté.
kiosk:
  addresses: []

ui:
  # Retour automatique à l'écran d'accueil après ce délai sans contact (secondes).
  idleTimeoutSeconds: 180

# Météo (Open-Meteo, modèles Météo-France). Sans cette section, le bloc météo est masqué.
#   label          : nom du lieu affiché
#   latitude/longitude : coordonnées en degrés décimaux ; deux décimales (~1 km) suffisent
#   refreshMinutes : intervalle entre deux appels à l'API (5 à 180, 15 par défaut)
weather:
  label: Paris
  latitude: 48.85
  longitude: 2.35
