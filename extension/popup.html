<!doctype html>
<!-- Extension « Remplir le panier » : panneau ouvert par le bouton de l'extension (coller le panier, lancer, compte rendu). -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HomeHub · Remplir le panier</title>
    <style>
      :root {
        --bg: #0f1115;
        --surface: #1a1d24;
        --surface-2: #252a33;
        --fg: #f2f4f8;
        --fg-muted: #a3aab8;
        --rain: #5b8def;
        --ok: #4caf7a;
        --sun: #f2b84b;
        --danger: #e5484d;
        --border-strong: #3a414d;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { width: 380px; max-width: 100%; margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 18px; }
      h2 { margin: 12px 0 4px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); }
      p { margin: 6px 0; }
      .muted { color: var(--fg-muted); font-size: 13px; }
      .warn { color: var(--sun); }
      .error { color: var(--danger); }
      textarea { width: 100%; min-height: 96px; padding: 8px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--fg); font: 12px/1.3 ui-monospace, monospace; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      select { padding: 8px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; }
      button { padding: 9px 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface-2); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
      button.primary { border-color: var(--rain); background: var(--rain); color: var(--bg); }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { margin: 6px 0; padding: 0; list-style: none; max-height: 260px; overflow: auto; }
      li { display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid var(--surface-2); }
      li .state { font-size: 13px; color: var(--fg-muted); }
      li.added .state, li.already .state { color: var(--ok); }
      li.skipped .state { color: var(--sun); }
      li.failed .state { color: var(--danger); }
    </style>
  </head>
  <body>
    <h1>Remplir le panier</h1>
    <p class="muted">HomeHub · Courses U, depuis ton compte, dans cet onglet.</p>
    <main id="app"></main>
    <script src="popup.js"></script>
  </body>
</html>
